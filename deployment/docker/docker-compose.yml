version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped
