version: '3.8'

services:
  # ── Qdrant Vector DB ────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: finvault-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Redis Cache & State Store ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finvault-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ── Kafka & Zookeeper Event Streaming ───────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: finvault-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: finvault-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ── Python Backend (FastAPI + AI Orchestrator) ──────────────────────────────
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: finvault-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONIOENCODING=utf-8
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}  # Forward key from shell environment
    depends_on:
      - redis
      - qdrant
      - kafka
    restart: unless-stopped

  # ── .NET Core Frontend WebApp ───────────────────────────────────────────────
  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: finvault-frontend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - BACKEND_API_BASE=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ── Prometheus (Metrics Scraping) ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: finvault-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend
    restart: unless-stopped

  # ── Grafana (Visualization Dashboards) ─────────────────────────────────────
  grafana:
    image: grafana/grafana:10.0.0
    container_name: finvault-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ── Loki (Log Aggregation) ──────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.8.2
    container_name: finvault-loki
    ports:
      - "3100:3100"
    volumes:
      - ../../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

volumes:
  qdrant_data:
