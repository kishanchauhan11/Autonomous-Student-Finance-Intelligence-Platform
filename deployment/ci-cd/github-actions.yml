name: FinVault CI/CD Pipeline

# ── Trigger Conditions ────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

# ── Environment Variables ─────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/finvault-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/finvault-frontend
  PYTHON_VERSION: "3.11"
  DOTNET_VERSION: "8.0"

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # JOB 1: Python Backend — Lint, Test, Security Scan
  # ═══════════════════════════════════════════════════════════════════════
  backend-test:
    name: Backend Tests & Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run Lint (Ruff)
        run: pip install ruff && ruff check .

      - name: Run Unit & Integration Tests
        run: python -m pytest ../testing/test_platform.py -v --tb=short
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY_TEST }}

      - name: Security Scan (Bandit)
        run: pip install bandit && bandit -r . -ll -x ./venv

      - name: Dependency Vulnerability Check (Safety)
        run: pip install safety && safety check -r requirements.txt

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 2: .NET Frontend — Build & Test
  # ═══════════════════════════════════════════════════════════════════════
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Frontend
        run: dotnet build --configuration Release --no-restore

      - name: Publish Frontend
        run: dotnet publish --configuration Release --output ./publish --no-restore

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-publish
          path: ./frontend/publish
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 3: Docker Build & Push to GHCR
  # ═══════════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./deployment/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./deployment/docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 4: Deploy to Kubernetes (Staging)
  # ═══════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging (Kubernetes)
    runs-on: ubuntu-latest
    needs: [docker-build]
    environment:
      name: staging
      url: https://staging.finvault.yourdomain.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy via Helm
        run: |
          helm upgrade --install finvault ./deployment/helm-charts \
            --namespace finvault-staging \
            --create-namespace \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set global.environment=staging \
            --wait --timeout=300s

      - name: Run Smoke Tests
        run: |
          STAGING_URL="https://staging.finvault.yourdomain.com"
          curl -f "$STAGING_URL/" || exit 1
          curl -f "$STAGING_URL/api/student/STU-2021-4892" || exit 1
          echo "Smoke tests passed."

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 5: Deploy to Production (manual approval gate)
  # ═══════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment:
      name: production
      url: https://finvault.yourdomain.com
    if: github.event_name == 'release'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to Production via Helm
        run: |
          helm upgrade --install finvault ./deployment/helm-charts \
            --namespace finvault-prod \
            --create-namespace \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set global.environment=production \
            --wait --timeout=600s

      - name: Notify Slack on Deployment
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: "finvault-deployments"
          slack-message: "✅ FinVault v${{ github.event.release.tag_name }} deployed to production successfully!"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
