apiVersion: apps/v1
kind: Deployment
metadata:
  name: finvault-frontend
  namespace: default
  labels:
    app: finvault-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finvault-frontend
  template:
    metadata:
      labels:
        app: finvault-frontend
    spec:
      containers:
      - name: frontend
        image: finvault-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: finvault-frontend-svc
  namespace: default
spec:
  selector:
    app: finvault-frontend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: LoadBalancer
