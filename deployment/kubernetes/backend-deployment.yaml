apiVersion: apps/v1
kind: Deployment
metadata:
  name: finvault-backend
  namespace: default
  labels:
    app: finvault-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finvault-backend
  template:
    metadata:
      labels:
        app: finvault-backend
    spec:
      containers:
      - name: backend
        image: finvault-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: PYTHONIOENCODING
          value: "utf-8"
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: finvault-backend-svc
  namespace: default
spec:
  selector:
    app: finvault-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
