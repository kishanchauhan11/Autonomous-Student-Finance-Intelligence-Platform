# Nginx Reverse Proxy & API Gateway Configuration for FinVault
# Handles TLS termination, rate limiting, load balancing, and CORS for the platform.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    use epoll;
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────
    log_format main_json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes":"$body_bytes_sent",'
        '"referrer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time"}';
    
    access_log /var/log/nginx/access.log main_json;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    gzip                on;
    gzip_types          text/plain application/json application/javascript text/css;
    gzip_min_length     1024;

    # ── Rate Limiting Zones ───────────────────────────────────────────────
    # Student API: 30 requests/min per IP
    limit_req_zone $binary_remote_addr zone=student_api:10m rate=30r/m;
    # AI Chat: 10 requests/min per IP (heavier operations)
    limit_req_zone $binary_remote_addr zone=ai_chat:10m rate=10r/m;
    # Officer API: 60 requests/min
    limit_req_zone $binary_remote_addr zone=officer_api:10m rate=60r/m;

    # ── Upstream Backends ────────────────────────────────────────────────
    upstream finvault_backend {
        least_conn;
        server backend:8000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream finvault_frontend {
        server frontend:5000;
        keepalive 16;
    }

    # ── HTTP → HTTPS Redirect ────────────────────────────────────────────
    server {
        listen 80;
        server_name finvault.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS Server ────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name finvault.yourdomain.com;

        # ── TLS Configuration ─────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/finvault.crt;
        ssl_certificate_key /etc/nginx/ssl/finvault.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security Headers ──────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' cdn.jsdelivr.net unpkg.com fonts.googleapis.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com unpkg.com; font-src fonts.gstatic.com; img-src 'self' data:;" always;

        # ── FastAPI Backend API Gateway ───────────────────────────────
        location /api/ {
            limit_req zone=student_api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://finvault_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # ── AI Chat Endpoint (stricter rate limit) ────────────────────
        location /api/chat {
            limit_req zone=ai_chat burst=5 nodelay;
            proxy_pass         http://finvault_backend;
            proxy_read_timeout 180s;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Officer AI Endpoint ──────────────────────────────────────
        location /api/officer/ {
            limit_req zone=officer_api burst=30 nodelay;
            proxy_pass         http://finvault_backend;
            proxy_read_timeout 180s;
        }

        # ── PDF Downloads ─────────────────────────────────────────────
        location /downloads/ {
            proxy_pass         http://finvault_backend;
            proxy_buffering    on;
            proxy_buffer_size  16k;
        }

        # ── Health Check (no rate limit) ──────────────────────────────
        location /health {
            proxy_pass http://finvault_backend/;
            access_log off;
        }

        # ── Frontend (catch-all) ──────────────────────────────────────
        location / {
            proxy_pass         http://finvault_frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Error Pages ───────────────────────────────────────────────
        error_page 429 /rate_limited.json;
        location = /rate_limited.json {
            internal;
            return 429 '{"error":"Rate limit exceeded. Please wait before retrying.","code":429}';
            add_header Content-Type application/json;
        }

        error_page 502 503 504 /service_unavailable.json;
        location = /service_unavailable.json {
            internal;
            return 503 '{"error":"FinVault service temporarily unavailable. Try again shortly.","code":503}';
            add_header Content-Type application/json;
        }
    }
}
